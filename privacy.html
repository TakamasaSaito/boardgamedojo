<html lang="ja">
<head>

<title>&#12503;&#12521;&#12452;&#12496;&#12471;&#12540;&#12509;&#12522;&#12471;&#12540; | BoardGameDojo</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0f0f0f;
  --surface:  #1a1a1a;
  --surface2: #222222;
  --accent:   #00bcd4;
  --text:     #e0e0e0;
  --text-dim: #888888;
  --radius:   12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
  background-color: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* ========== グローバルヘッダー ========== */
#app-header {
  position: fixed; top: 0; left: 0; right: 0;
  height: 48px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: rgba(15,15,15,0.97);
  border-bottom: 1px solid rgba(0,188,212,0.15);
}

.hdr-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.hdr-btn {
  min-width: 40px; min-height: 40px;
  background: transparent;
  border: 1px solid rgba(0,188,212,0.25);
  border-radius: var(--radius);
  color: var(--text); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
}
.hdr-btn:active { border-color: var(--accent); color: var(--accent); }

/* パンくず */
.breadcrumb { display: flex; align-items: center; flex-shrink: 1; min-width: 0; overflow: hidden; }
.bc-home { display: flex; align-items: center; gap: 4px; text-decoration: none; color: var(--accent); white-space: nowrap; }
.bc-home:hover { opacity: 0.8; }
.bc-arrow { font-size: 14px; }
.bc-site { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.bc-sep { color: #444; font-size: 13px; margin: 0 6px; }
.bc-current { font-size: 14px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
@media (min-width: 769px) { .bc-full { display: inline; } .bc-current { display: inline; } }

/* ========== コンテンツ ========== */
.page-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 20px 64px;
}

.page-logo {
  font-family: 'Orbitron', 'Noto Sans', sans-serif;
  font-size: 11px; font-weight: 700;
  color: var(--accent); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 10px;
}

.page-title {
  font-size: 22px; font-weight: 900;
  color: var(--text); letter-spacing: 0.5px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(0,188,212,0.2);
  margin-bottom: 36px;
}

/* セクション */
.section {
  margin-bottom: 40px;
}

.section-title {
  font-size: 11px; font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px; text-transform: uppercase;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,188,212,0.15);
  margin-bottom: 14px;
}

.section p {
  font-size: 14px;
  color: var(--text);
  line-height: 1.9;
  margin-bottom: 12px;
}

.section p:last-child { margin-bottom: 0; }

.section a {
  color: var(--accent);
  text-decoration: none;
}
.section a:hover { text-decoration: underline; }

/* メモボックス */
.note-box {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid rgba(0,188,212,0.12);
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.85;
  margin-top: 12px;
}

/* フッター */
footer {
  text-align: center;
  padding: 24px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 11px;
  color: #3a3a3a;
  letter-spacing: 1px;
}

/* ========== PC最適化 ========== */
@media (min-width: 769px) {
  .page-wrap { max-width: 760px; padding: 80px 48px 80px; }
  .page-title { font-size: 28px; }
}
</style>
</head>

<script>

function applyLang() {
  var t = T[lang];
  var el;
  document.documentElement.lang = lang;
  el = document.getElementById('page-title');     if (el) el.textContent = t.pageTitle;
  el = document.getElementById('bc-label');       if (el) el.textContent = t.bcLabel;
  el = document.getElementById('sec1-title');     if (el) el.textContent = t.sec1Title;
  el = document.getElementById('sec1-body');      if (el) el.textContent = t.sec1Body;
  el = document.getElementById('sec2-title');     if (el) el.textContent = t.sec2Title;
  el = document.getElementById('sec2-body1');     if (el) el.textContent = t.sec2Body1;
  el = document.getElementById('sec2-link-pre');  if (el) el.textContent = t.sec2LinkPre;
  el = document.getElementById('sec2-link1-text'); if (el) el.textContent = t.sec2Link1;
  el = document.getElementById('sec2-link-mid');  if (el) el.textContent = t.sec2LinkMid;
  el = document.getElementById('sec2-link2-text'); if (el) el.textContent = t.sec2Link2;
  el = document.getElementById('sec2-link-post'); if (el) el.textContent = t.sec2LinkPost;
  el = document.getElementById('sec3-title');     if (el) el.textContent = t.sec3Title;
  el = document.getElementById('sec3-body1');     if (el) el.textContent = t.sec3Body1;
  el = document.getElementById('sec3-note');      if (el) el.textContent = t.sec3Note;
  el = document.getElementById('sec4-title');     if (el) el.textContent = t.sec4Title;
  el = document.getElementById('sec4-body');      if (el) el.textContent = t.sec4Body;
  el = document.getElementById('sec5-title');     if (el) el.textContent = t.sec5Title;
  el = document.getElementById('sec5-body');      if (el) el.textContent = t.sec5Body;
  el = document.getElementById('footer-contact'); if (el) el.textContent = t.contactLink;
  el = document.getElementById('lang-btn');       if (el) el.textContent = t.langBtn;
}

function toggleLang() {
  lang = (lang === 'ja') ? 'en' : 'ja';
  applyLang();
}

applyLang();
</script>
