<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>the ONE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f0f; color: #e0e0e0; font-family: "Noto Sans JP", "Noto Sans", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
.screen { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 24px; }
.screen.hidden { display: none; }
.app-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; }
.logo-btn { background: none; border: none; cursor: pointer; padding: 4px; }
a.logo-btn { text-decoration: none; display: inline-flex; align-items: center; }
.logo-text { font-family: "Orbitron", sans-serif; font-size: 20px; font-weight: 900; color: #00bcd4; letter-spacing: 2px; }
.header-right { display: flex; gap: 8px; align-items: center; }
.icon-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #e0e0e0; font-size: 18px; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
#screen-splash { justify-content: center; }
.splash-logo { font-family: "Orbitron", sans-serif; font-size: 56px; font-weight: 900; color: #00bcd4; letter-spacing: 6px; text-shadow: 0 0 30px rgba(0,188,212,0.6); animation: splashPulse 1.5s ease-in-out infinite; }
.splash-sub { color: #888; font-size: 13px; margin-top: 12px; letter-spacing: 2px; }
@keyframes splashPulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
.home-sub { color: #888; font-size: 12px; margin-bottom: 28px; letter-spacing: 1px; }
.section-label { color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 20px 0 10px; width: 100%; max-width: 280px; }
.btn-primary { background: #00bcd4; color: #0f0f0f; border: none; border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; max-width: 280px; min-height: 50px; box-shadow: 0 4px 16px rgba(0,188,212,0.3); font-family: "Noto Sans JP", sans-serif; }
.btn-outline { background: transparent; color: #00bcd4; border: 2px solid #00bcd4; border-radius: 12px; padding: 12px 32px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; max-width: 280px; min-height: 50px; margin-top: 10px; font-family: "Noto Sans JP", sans-serif; }
.diff-wrap { width: 100%; max-width: 280px; }
.diff-row { display: flex; gap: 8px; margin-top: 4px; }
.diff-btn { background: #1a1a1a; color: #e0e0e0; border: 2px solid #333; border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 700; cursor: pointer; flex: 1; min-height: 44px; font-family: "Noto Sans JP", sans-serif; }
.diff-btn.active { border-color: #00bcd4; color: #00bcd4; background: rgba(0,188,212,0.08); }
#player-indicator { font-size: 17px; font-weight: 700; color: #00bcd4; text-align: center; margin: 6px 0 2px; }
#game-status { font-size: 12px; color: #888; height: 18px; text-align: center; width: 100%; overflow: hidden; }
#ai-thinking { visibility: hidden; color: #00bcd4; font-size: 12px; text-align: center; height: 18px; margin: 2px 0; letter-spacing: 1px; }
#hand-area { width: 100%; background: #1a1a1a; border-radius: 12px; padding: 10px 12px; margin: 6px 0; height: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.5); border: 1px solid #222; }
#hand-label { font-size: 11px; color: #666; margin-bottom: 6px; letter-spacing: 1px; }
#hand-tile { width: 64px; height: 64px; background: #252525; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #fff; cursor: pointer; border: 2px solid #444; user-select: none; font-family: "Noto Sans", sans-serif; }
#hand-tile:active { background: #333; border-color: #00bcd4; }
#hand-empty { color: #444; font-size: 12px; }
#hand-hint { font-size: 10px; color: #555; margin-top: 4px; }
#board-wrap { position: relative; width: 300px; height: 312px; margin: 6px auto; }
.arrow-btn { position: absolute; width: 44px; height: 44px; background: #1a1a1a; border: 2px solid #2a2a2a; border-radius: 8px; color: #444; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.arrow-btn.active { border-color: #00bcd4; color: #00bcd4; box-shadow: 0 0 8px rgba(0,188,212,0.3); }
.arrow-btn:disabled { opacity: 0.15; cursor: default; box-shadow: none; }
#arr-c0-top { left: 56px; top: 0; } #arr-c1-top { left: 128px; top: 0; } #arr-c2-top { left: 200px; top: 0; }
#arr-c0-bot { left: 56px; top: 256px; } #arr-c1-bot { left: 128px; top: 256px; } #arr-c2-bot { left: 200px; top: 256px; }
#arr-r0-left { top: 56px; left: 0; } #arr-r1-left { top: 128px; left: 0; } #arr-r2-left { top: 200px; left: 0; }
#arr-r0-right { top: 56px; right: 0; } #arr-r1-right { top: 128px; right: 0; } #arr-r2-right { top: 200px; right: 0; }
#board-grid { position: absolute; left: 44px; top: 44px; width: 212px; height: 212px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; }
.cell { background: #1e1e1e; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #e0e0e0; cursor: pointer; border: 2px solid #2a2a2a; user-select: none; font-family: "Noto Sans", sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.cell.face-down::after { content: ""; width: 18px; height: 18px; background: #2e2e2e; border-radius: 4px; display: block; border: 1px solid #3a3a3a; }
.cell.center { border-color: rgba(0,188,212,0.4); cursor: default; }
.cell-null { background: transparent; border: 2px dashed #222; border-radius: 10px; }
#action-hint { color: #666; font-size: 12px; text-align: center; margin: 4px 0; height: 18px; overflow: hidden; }
#msg-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
#msg-overlay.show { display: flex; }
#msg-box { background: #1a1a1a; border-radius: 16px; padding: 32px 24px; text-align: center; max-width: 300px; width: 90%; border: 2px solid #00bcd4; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
#msg-title { font-size: 22px; font-weight: 900; color: #00bcd4; margin-bottom: 10px; font-family: "Orbitron", sans-serif; }
#msg-body { color: #aaa; font-size: 14px; margin-bottom: 24px; line-height: 1.6; white-space: pre-line; }
#msg-btn { background: #00bcd4; color: #0f0f0f; border: none; border-radius: 10px; padding: 12px 32px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: "Noto Sans JP", sans-serif; }
#screen-howto { background: #0f0f0f; }
.howto-body { width: 100%; padding: 8px 0 0; }
.howto-sec { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #222; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.howto-sec h3 { color: #00bcd4; font-size: 14px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
.howto-sec p { color: #aaa; font-size: 13px; line-height: 1.7; }
.tile-demo { display: flex; gap: 8px; margin: 10px 0; align-items: center; flex-wrap: wrap; }
.tile-chip { background: #252525; border: 2px solid #333; border-radius: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #e0e0e0; font-family: "Noto Sans", sans-serif; }
.tile-arr { color: #555; font-size: 14px; }
.close-btn { background: #1a1a1a; color: #00bcd4; border: 2px solid #00bcd4; border-radius: 12px; padding: 12px 32px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; max-width: 280px; margin-top: 8px; font-family: "Noto Sans JP", sans-serif; min-height: 50px; }
@media (min-width: 769px) {
  .screen { max-width: 520px; }
  #board-wrap { transform: scale(1.5); transform-origin: top center; margin-bottom: 156px; }
}
.breadcrumb { display: flex; align-items: center; flex-shrink: 1; min-width: 0; overflow: hidden; }
.bc-home { display: flex; align-items: center; gap: 4px; text-decoration: none; color: #00bcd4; white-space: nowrap; }
.bc-home:hover { opacity: 0.8; }
.bc-arrow { font-size: 14px; }
.bc-site { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.bc-sep { color: #444; font-size: 13px; margin: 0 6px; }
.bc-current { font-size: 14px; font-weight: 700; color: #e0e0e0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr-right, .header-right { flex-shrink: 0; }
.bc-full { display: none; }
@media (min-width: 769px) { .bc-full { display: inline; } }
</style>
</head>
<body>

<div id="screen-splash" class="screen">
  <div class="splash-logo">the ONE</div>
  <div class="splash-sub" id="splash-sub">WORD PUZZLE TIC-TAC-TOE</div>
</div>

<div id="screen-home" class="screen hidden">
  <div class="app-header">
    <nav class="breadcrumb"><a class="bc-home" href="../index.html"><span class="bc-arrow">&larr;</span><span class="bc-site bc-full">BoardGameDojo</span></a><span class="bc-sep bc-full"> | </span><span class="bc-current">the ONE</span></nav>
    <div class="header-right">
      <button class="icon-btn" id="lang-btn" onclick="toggleLang()">&#127471;&#127477;</button>
      <button class="icon-btn" onclick="openHowto('home')">?</button>
    </div>
  </div>
  <div class="home-sub" id="home-sub">ワードパズル三目ならべ</div>
  <div class="section-label" id="label-mode">モードを選択</div>
  <button class="btn-primary" id="btn-1p" onclick="selectMode(1)">1人用（AI対戦）</button>
  <button class="btn-outline" id="btn-2p" onclick="selectMode(2)">2人対戦</button>
  <div id="difficulty-area" class="diff-wrap" style="display:none;">
    <div class="section-label" id="label-diff" style="max-width:100%;margin-top:20px;">AI難易度</div>
    <div class="diff-row">
      <button class="diff-btn active" id="d-easy" onclick="selectDiff('easy')">かんたん</button>
      <button class="diff-btn" id="d-normal" onclick="selectDiff('normal')">ふつう</button>
      <button class="diff-btn" id="d-hard" onclick="selectDiff('hard')">むずかしい</button>
    </div>
    <button class="btn-primary" id="btn-start" onclick="startGame()" style="margin-top:20px;">ゲームスタート</button>
  </div>
</div>

<div id="screen-game" class="screen hidden">
  <div class="app-header">
    <nav class="breadcrumb"><a class="bc-home" href="../index.html"><span class="bc-arrow">&larr;</span><span class="bc-site bc-full">BoardGameDojo</span></a><span class="bc-sep bc-full"> | </span><span class="bc-current">the ONE</span></nav>
    <div class="header-right">
      <button class="icon-btn" id="lang-btn-g" onclick="toggleLang()">&#127471;&#127477;</button>
      <button class="icon-btn" onclick="openHowto('game')">?</button>
    </div>
  </div>
  <div id="player-indicator">あなたのターン</div>
  <div id="game-status"></div>
  <div id="ai-thinking">AIが考え中...</div>
  <div id="hand-area">
    <div id="hand-label">手持ちタイル</div>
    <div id="hand-empty">（まだ取っていません）</div>
    <div id="hand-tile" style="display:none;" onclick="rotateTile()"></div>
    <div id="hand-hint"></div>
  </div>
  <div id="board-wrap">
    <button class="arrow-btn" id="arr-c0-top" onclick="pushCol(0,'top')" disabled>&#9660;</button>
    <button class="arrow-btn" id="arr-c1-top" onclick="pushCol(1,'top')" disabled>&#9660;</button>
    <button class="arrow-btn" id="arr-c2-top" onclick="pushCol(2,'top')" disabled>&#9660;</button>
    <button class="arrow-btn" id="arr-c0-bot" onclick="pushCol(0,'bot')" disabled>&#9650;</button>
    <button class="arrow-btn" id="arr-c1-bot" onclick="pushCol(1,'bot')" disabled>&#9650;</button>
    <button class="arrow-btn" id="arr-c2-bot" onclick="pushCol(2,'bot')" disabled>&#9650;</button>
    <button class="arrow-btn" id="arr-r0-left" onclick="pushRow(0,'left')" disabled>&#9654;</button>
    <button class="arrow-btn" id="arr-r1-left" onclick="pushRow(1,'left')" disabled>&#9654;</button>
    <button class="arrow-btn" id="arr-r2-left" onclick="pushRow(2,'left')" disabled>&#9654;</button>
    <button class="arrow-btn" id="arr-r0-right" onclick="pushRow(0,'right')" disabled>&#9664;</button>
    <button class="arrow-btn" id="arr-r1-right" onclick="pushRow(1,'right')" disabled>&#9664;</button>
    <button class="arrow-btn" id="arr-r2-right" onclick="pushRow(2,'right')" disabled>&#9664;</button>
    <div id="board-grid"></div>
  </div>
  <div id="action-hint"></div>
</div>

<div id="screen-howto" class="screen hidden">
  <div class="app-header">
    <nav class="breadcrumb"><a class="bc-home" href="../index.html"><span class="bc-arrow">&larr;</span><span class="bc-site bc-full">BoardGameDojo</span></a><span class="bc-sep bc-full"> | </span><span class="bc-current">the ONE</span></nav>
    <div class="header-right">
      <button class="icon-btn" id="lang-btn-h" onclick="toggleLang()">&#127471;&#127477;</button>
    </div>
  </div>
  <div class="howto-body" id="howto-body"></div>
  <button class="close-btn" id="close-howto-btn" onclick="closeHowto()">閉じる</button>
</div>

<div id="msg-overlay">
  <div id="msg-box">
    <div id="msg-title"></div>
    <div id="msg-body"></div>
    <button id="msg-btn" onclick="closeMsg()">もう一度</button>
  </div>
</div>
<script>
var lang = "ja";

// UI text - all non-ASCII via unicode escapes
var TJA = {
  homeSub: "ワードパズル三目ならべ",
  labelMode: "モードを選択",
  btn1p: "1人用（AI対戦）",
  btn2p: "2人対戦",
  labelDiff: "AI難易度",
  easy: "かんたん",
  normal: "ふつう",
  hard: "むずかしい",
  btnStart: "ゲームスタート",
  yourTurn: "あなたのターン",
  aiTurn: "AIのターン",
  p1Turn: "プレイヤー1のターン",
  p2Turn: "プレイヤー2のターン",
  handLabel: "手持ちタイル",
  handEmpty: "（まだ取っていません）",
  handHint: "タップで回転",
  hintPick: "タイルをタップして取ってください（中央以外）",
  hintPush: "手持ちタイルをタップで回転 → 矢印で押し込む",
  noPickable: "表向きのタイルは取れません",
  noCenterPick: "中央のタイルは取れません",
  aiThinking: "AIが考え中...",
  smallMsg: "小当たり！次のターンでONEが揃わなければ勝ち！",
  bigWin: "大当たり！",
  smallWin: "小当たり勝利！",
  draw: "引き分け",
  drawBody: "取れるタイルがなくなりました。\n引き分けです！",
  playAgain: "もう一度",
  closeHowto: "閉じる",
  you: "あなた",
  p: "プレイヤー",
  winsRow: "の勝利！\n横一列にONEが揃いました！",
  winsSmall: "の勝利！\nONEを阻止できませんでした。"
};
var TEN = {
  homeSub: "Word Puzzle Tic-Tac-Toe",
  labelMode: "Select Mode",
  btn1p: "1 Player (vs AI)",
  btn2p: "2 Players",
  labelDiff: "AI Difficulty",
  easy: "Easy",
  normal: "Normal",
  hard: "Hard",
  btnStart: "Start Game",
  yourTurn: "Your Turn",
  aiTurn: "AI Turn",
  p1Turn: "Player 1 Turn",
  p2Turn: "Player 2 Turn",
  handLabel: "Hand Tile",
  handEmpty: "(Not picked yet)",
  handHint: "Tap to rotate",
  hintPick: "Tap a tile to pick (not center)",
  hintPush: "Tap tile to rotate, then push with arrows",
  noPickable: "Cannot pick a face-up tile",
  noCenterPick: "Cannot pick the center tile",
  aiThinking: "AI thinking...",
  smallMsg: "Small Atari! Win if opponent misses ONE!",
  bigWin: "ONE Complete!",
  smallWin: "Small Atari Win!",
  draw: "Draw",
  drawBody: "No tiles left to pick.\nIt is a draw!",
  playAgain: "Play Again",
  closeHowto: "Close",
  you: "You",
  p: "Player ",
  winsRow: " wins!\nONE aligned in a row!",
  winsSmall: " wins!\nFailed to complete ONE."
};

function t(key) { return (lang === "ja") ? (TJA[key] || key) : (TEN[key] || key); }

function toggleLang() {
  lang = (lang === "ja") ? "en" : "ja";
  var flag = (lang === "ja") ? "&#127471;&#127477;" : "&#127482;&#127480;";
  document.getElementById("lang-btn").innerHTML = flag;
  document.getElementById("lang-btn-g").innerHTML = flag;
  document.getElementById("lang-btn-h").innerHTML = flag;
  applyLang();
}

function applyLang() {
  var ids  = ["home-sub","label-mode","btn-1p","btn-2p","label-diff","d-easy","d-normal","d-hard","btn-start","hand-label","hand-empty","close-howto-btn","msg-btn"];
  var keys = ["homeSub","labelMode","btn1p","btn2p","labelDiff","easy","normal","hard","btnStart","handLabel","handEmpty","closeHowto","playAgain"];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.textContent = t(keys[i]);
  }
  document.getElementById("ai-thinking").textContent = t("aiThinking");
  updatePlayerIndicator();
  renderHowto();
}

var howtoFrom = "home";
function openHowto(from) { howtoFrom = from; renderHowto(); showScreen("howto"); }
function closeHowto() { showScreen(howtoFrom === "game" ? "game" : "home"); }

function renderHowto() {
  var body = document.getElementById("howto-body");
  if (!body) return;
  if (lang === "ja") {
    body.innerHTML =
      "<div class=\"howto-sec\"><h3>目的</h3><p>コマの向きと配置を変えて、横一列に「O・N・E」を揃えたプレイヤーが勝利します。</p></div>" +
      "<div class=\"howto-sec\"><h3>コマの種類</h3><p>コマは90度回転するごとに文字が変わります。</p>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">O</div><span class=\"tile-arr\">→ O</span></div>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">N</div><span class=\"tile-arr\">→ Z → N...</span></div>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">E</div><span class=\"tile-arr\">→ 3 → M → W → E...</span></div></div>" +
      "<div class=\"howto-sec\"><h3>ターンの流れ</h3><p>① 中央以外の裏向きコマをタップして取る<br>② 手持ちコマをタップして向きを変える<br>③ 矢印ボタンで盤面に押し込む</p></div>" +
      "<div class=\"howto-sec\"><h3>勝利条件</h3><p><b>大当たり</b>：横一列に「O・N・E」を揃えたら即勝利！<br><br><b>小当たり</b>：縦・横・斌めに同じ文字を。3つ並べると小当たり。次のターンで相手がONEを作れなければ勝利。</p></div>" +
      "<div class=\"howto-sec\"><h3>引き分け</h3><p>取れる裏向きコマがなくなった場合は引き分けです。</p></div>";
  } else {
    body.innerHTML =
      "<div class=\"howto-sec\"><h3>Objective</h3><p>Change tile orientation and position to align O-N-E in a horizontal row to win.</p></div>" +
      "<div class=\"howto-sec\"><h3>Tile Types</h3><p>Each tile changes letter every 90-degree rotation.</p>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">O</div><span class=\"tile-arr\">stays O</span></div>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">N</div><span class=\"tile-arr\">to Z to N...</span></div>" +
      "<div class=\"tile-demo\"><div class=\"tile-chip\">E</div><span class=\"tile-arr\">to 3 to M to W to E...</span></div></div>" +
      "<div class=\"howto-sec\"><h3>Turn Flow</h3><p>1. Tap a face-down tile (not center) to pick<br>2. Tap hand tile to rotate<br>3. Push into board with arrow buttons</p></div>" +
      "<div class=\"howto-sec\"><h3>Win Conditions</h3><p><b>Big Win</b>: Align O-N-E in a horizontal row - instant win!<br><br><b>Small Atari</b>: Align 3 same letters in any line. Win if opponent misses ONE next turn.</p></div>" +
      "<div class=\"howto-sec\"><h3>Draw</h3><p>If no face-down tiles remain to pick, the game ends in a draw.</p></div>";
  }
}

function showScreen(name) {
  var ids = ["splash","home","game","howto"];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById("screen-" + ids[i]);
    if (ids[i] === name) { el.classList.remove("hidden"); } else { el.classList.add("hidden"); }
  }
}

function goHome() {
  aiThinking = false;
  document.getElementById("difficulty-area").style.display = "none";
  showScreen("home");
}

var gameMode = 1;
var aiDifficulty = "easy";
var currentPlayer = 1;
var board = [];
var handTile = null;
var pickedPos = null;
var phase = "pick";
var smallAtari = false;
var smallAtariPlayer = 0;
var aiThinking = false;
var LETTER = { "O": ["O","O","O","O"], "N": ["N","Z","N","Z"], "E": ["E","3","M","W"] };

function selectMode(m) {
  gameMode = m;
  if (m === 1) { document.getElementById("difficulty-area").style.display = "block"; }
  else { startGame(); }
}

function selectDiff(d) {
  aiDifficulty = d;
  document.querySelectorAll(".diff-btn").forEach(function(b) { b.classList.remove("active"); });
  document.getElementById("d-" + d).classList.add("active");
}

function startGame() {
  currentPlayer = 1; handTile = null; pickedPos = null; phase = "pick";
  smallAtari = false; smallAtariPlayer = 0; aiThinking = false;
  var types = ["O","O","O","N","N","N","E","E","E"];
  for (var i = types.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = types[i]; types[i] = types[j]; types[j] = tmp; }
  board = [];
  for (var r = 0; r < 3; r++) { board.push([]); for (var c = 0; c < 3; c++) { board[r].push({ type: types[r*3+c], rot: 0, faceUp: false }); } }
  showScreen("game");
  renderBoard(); updateHandArea(); updateArrows();
  setStatus(""); setActionHint(t("hintPick")); updatePlayerIndicator();
}

function renderBoard() {
  var grid = document.getElementById("board-grid"); grid.innerHTML = "";
  for (var r = 0; r < 3; r++) {
    for (var c = 0; c < 3; c++) {
      var cell = document.createElement("div");
      var tile = board[r][c];
      if (!tile) { cell.className = "cell-null"; }
      else if (!tile.faceUp) { cell.className = "cell face-down" + ((r===1&&c===1)?" center":""); }
      else { cell.className = "cell" + ((r===1&&c===1)?" center":""); cell.textContent = LETTER[tile.type][tile.rot]; }
      (function(row,col){ cell.onclick = function(){ pickTile(row,col); }; })(r,c);
      grid.appendChild(cell);
    }
  }
}

function updateHandArea() {
  var empty = document.getElementById("hand-empty"), tile = document.getElementById("hand-tile"), hint = document.getElementById("hand-hint");
  if (!handTile) { empty.style.display = "block"; tile.style.display = "none"; hint.textContent = ""; }
  else { empty.style.display = "none"; tile.style.display = "flex"; tile.textContent = LETTER[handTile.type][handTile.rot]; hint.textContent = t("handHint"); }
}

function colHasNull(col) { return board[0][col]===null||board[1][col]===null||board[2][col]===null; }
function rowHasNull(row) { return board[row][0]===null||board[row][1]===null||board[row][2]===null; }
function canPushCol(col,dir) {
  if (!colHasNull(col)) return false;
  if (!pickedPos) return true;
  var landRow = (dir==="top")?0:2;
  return !(col===pickedPos.c && landRow===pickedPos.r);
}
function canPushRow(row,dir) {
  if (!rowHasNull(row)) return false;
  if (!pickedPos) return true;
  var landCol = (dir==="left")?0:2;
  return !(row===pickedPos.r && landCol===pickedPos.c);
}

function updateArrows() {
  var inPush = (phase==="push" && handTile!==null);
  for (var col=0;col<3;col++) {
    var tBtn=document.getElementById("arr-c"+col+"-top"), bBtn=document.getElementById("arr-c"+col+"-bot");
    var tOk=inPush&&canPushCol(col,"top"), bOk=inPush&&canPushCol(col,"bot");
    tBtn.disabled=!tOk; bBtn.disabled=!bOk;
    if(tOk){tBtn.classList.add("active");}else{tBtn.classList.remove("active");}
    if(bOk){bBtn.classList.add("active");}else{bBtn.classList.remove("active");}
  }
  for (var row=0;row<3;row++) {
    var lBtn=document.getElementById("arr-r"+row+"-left"), rBtn=document.getElementById("arr-r"+row+"-right");
    var lOk=inPush&&canPushRow(row,"left"), rOk=inPush&&canPushRow(row,"right");
    lBtn.disabled=!lOk; rBtn.disabled=!rOk;
    if(lOk){lBtn.classList.add("active");}else{lBtn.classList.remove("active");}
    if(rOk){rBtn.classList.add("active");}else{rBtn.classList.remove("active");}
  }
}

function updatePlayerIndicator() {
  var el = document.getElementById("player-indicator"); if(!el) return;
  if (gameMode===1) { el.textContent = (currentPlayer===1)?t("yourTurn"):t("aiTurn"); }
  else { el.textContent = (currentPlayer===1)?t("p1Turn"):t("p2Turn"); }
}

function setStatus(msg) { var el=document.getElementById("game-status"); if(el) el.textContent=msg; }
function setActionHint(msg) { var el=document.getElementById("action-hint"); if(el) el.textContent=msg; }

function pickTile(r,c) {
  if(aiThinking||phase!=="pick") return;
  if(r===1&&c===1){setStatus(t("noCenterPick"));return;}
  if(!board[r][c]) return;
  if(board[r][c].faceUp){setStatus(t("noPickable"));return;}
  handTile={type:board[r][c].type,rot:board[r][c].rot};
  pickedPos={r:r,c:c}; board[r][c]=null; phase="push";
  playSound('pick');
  renderBoard(); updateHandArea(); updateArrows();
  setStatus(""); setActionHint(t("hintPush"));
}

function rotateTile() { if(!handTile||phase!=="push") return; handTile.rot=(handTile.rot+1)%4; playSound('rotate'); updateHandArea(); }

function pushCol(col,dir) {
  if(!handTile||phase!=="push"||!canPushCol(col,dir)) return;
  var placed={type:handTile.type,rot:handTile.rot,faceUp:true};
  if(dir==="top"){
    var nr=-1; for(var r=0;r<3;r++){if(board[r][col]===null){nr=r;break;}}
    for(var r2=nr;r2>0;r2--){board[r2][col]=board[r2-1][col];} board[0][col]=placed;
  } else {
    var nr2=-1; for(var r3=2;r3>=0;r3--){if(board[r3][col]===null){nr2=r3;break;}}
    for(var r4=nr2;r4<2;r4++){board[r4][col]=board[r4+1][col];} board[2][col]=placed;
  }
  handTile=null; pickedPos=null; playSound('push'); finishTurn();
}

function pushRow(row,dir) {
  if(!handTile||phase!=="push"||!canPushRow(row,dir)) return;
  var placed={type:handTile.type,rot:handTile.rot,faceUp:true};
  if(dir==="left"){
    var nc=-1; for(var c=0;c<3;c++){if(board[row][c]===null){nc=c;break;}}
    for(var c2=nc;c2>0;c2--){board[row][c2]=board[row][c2-1];} board[row][0]=placed;
  } else {
    var nc2=-1; for(var c3=2;c3>=0;c3--){if(board[row][c3]===null){nc2=c3;break;}}
    for(var c4=nc2;c4<2;c4++){board[row][c4]=board[row][c4+1];} board[row][2]=placed;
  }
  handTile=null; pickedPos=null; playSound('push'); finishTurn();
}

function finishTurn() {
  renderBoard(); updateHandArea(); updateArrows();
  if(checkONE()){
    var who;
    if(gameMode===1){who=(currentPlayer===1)?t("you"):"AI";}
    else{who=t("p")+currentPlayer;}
    playSound('win');
    showMsg(t("bigWin"), who+t("winsRow"));
    return;
  }
  if(smallAtari && currentPlayer!==smallAtariPlayer){
    var winner;
    if(gameMode===1){winner=(smallAtariPlayer===1)?t("you"):"AI";}
    else{winner=t("p")+smallAtariPlayer;}
    playSound('win');
    showMsg(t("smallWin"), winner+t("winsSmall"));
    return;
  }
  var sa=checkSmallAtari();
  if(sa){smallAtari=true;smallAtariPlayer=currentPlayer;setStatus(t("smallMsg"));}
  else{smallAtari=false;smallAtariPlayer=0;setStatus("");}
  currentPlayer=(currentPlayer===1)?2:1; phase="pick"; updatePlayerIndicator();
  var fdCount=0;
  for(var dr=0;dr<3;dr++){for(var dc=0;dc<3;dc++){if(dr===1&&dc===1)continue;if(board[dr][dc]&&!board[dr][dc].faceUp)fdCount++;}}
  if(fdCount===0){showMsg(t("draw"),t("drawBody"));return;}
  setActionHint(t("hintPick"));
  if(gameMode===1&&currentPlayer===2){doAITurn();}
}

function checkONE() {
  for(var r=0;r<3;r++){
    var c0=board[r][0],c1=board[r][1],c2=board[r][2];
    var l0=(c0&&c0.faceUp)?LETTER[c0.type][c0.rot]:null;
    var l1=(c1&&c1.faceUp)?LETTER[c1.type][c1.rot]:null;
    var l2=(c2&&c2.faceUp)?LETTER[c2.type][c2.rot]:null;
    if(l0==="O"&&l1==="N"&&l2==="E") return true;
  }
  return false;
}

function checkSmallAtari() {
  var lines=[[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],[[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],[[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]];
  for(var i=0;i<lines.length;i++){
    var ls=[];
    for(var j=0;j<3;j++){var tile=board[lines[i][j][0]][lines[i][j][1]];ls.push((tile&&tile.faceUp)?LETTER[tile.type][tile.rot]:null);}
    if(ls[0]&&ls[0]===ls[1]&&ls[1]===ls[2]) return true;
  }
  return false;
}

function doAITurn() {
  aiThinking=true; document.getElementById("ai-thinking").style.visibility="visible"; setActionHint("");
  var delay=800; if(aiDifficulty==="normal")delay=1200; if(aiDifficulty==="hard")delay=1600;
  setTimeout(function(){
    document.getElementById("ai-thinking").style.visibility="hidden";
    aiThinking=false; executeAI();
  },delay);
}

function executeAI() {
  var pickable=[];
  for(var r=0;r<3;r++){for(var c=0;c<3;c++){if(r===1&&c===1)continue;if(board[r][c]&&!board[r][c].faceUp)pickable.push([r,c]);}}
  if(pickable.length===0) return;
  var chosen=pickable[Math.floor(Math.random()*pickable.length)];
  handTile={type:board[chosen[0]][chosen[1]].type,rot:board[chosen[0]][chosen[1]].rot};
  pickedPos={r:chosen[0],c:chosen[1]}; board[chosen[0]][chosen[1]]=null; phase="push";
  renderBoard(); updateHandArea();
  var best=findBestMove(); handTile.rot=best.rot; updateHandArea();
  setTimeout(function(){
    if(best.type==="col"){pushCol(best.idx,best.dir);}else{pushRow(best.idx,best.dir);}
  },400);
}

function findBestMove() {
  var moves=[];
  for(var col=0;col<3;col++){if(canPushCol(col,"top"))moves.push({type:"col",idx:col,dir:"top"});if(canPushCol(col,"bot"))moves.push({type:"col",idx:col,dir:"bot"});}
  for(var row=0;row<3;row++){if(canPushRow(row,"left"))moves.push({type:"row",idx:row,dir:"left"});if(canPushRow(row,"right"))moves.push({type:"row",idx:row,dir:"right"});}
  if(moves.length===0) return {type:"col",idx:0,dir:"top",rot:0};
  if(aiDifficulty==="easy"&&Math.random()<0.6){var rm=moves[Math.floor(Math.random()*moves.length)];return{type:rm.type,idx:rm.idx,dir:rm.dir,rot:Math.floor(Math.random()*4)};}
  var bestScore=-9999,bestMove={type:moves[0].type,idx:moves[0].idx,dir:moves[0].dir,rot:0};
  for(var rot=0;rot<4;rot++){for(var mi=0;mi<moves.length;mi++){var sim=simMove(rot,moves[mi]);var score=evalSim(sim);if(score>bestScore){bestScore=score;bestMove={type:moves[mi].type,idx:moves[mi].idx,dir:moves[mi].dir,rot:rot};}}}
  return bestMove;
}

function simMove(rot,move) {
  var sim=[]; for(var r=0;r<3;r++){sim.push([]);for(var c=0;c<3;c++){var t=board[r][c];sim[r].push(t?{type:t.type,rot:t.rot,faceUp:t.faceUp}:null);}}
  var placed={type:handTile.type,rot:rot,faceUp:true};
  if(move.type==="col"){
    if(move.dir==="top"){var nr=-1;for(var r2=0;r2<3;r2++){if(sim[r2][move.idx]===null){nr=r2;break;}}for(var r3=nr;r3>0;r3--){sim[r3][move.idx]=sim[r3-1][move.idx];}sim[0][move.idx]=placed;}
    else{var nr2=-1;for(var r4=2;r4>=0;r4--){if(sim[r4][move.idx]===null){nr2=r4;break;}}for(var r5=nr2;r5<2;r5++){sim[r5][move.idx]=sim[r5+1][move.idx];}sim[2][move.idx]=placed;}
  } else {
    if(move.dir==="left"){var nc=-1;for(var c2=0;c2<3;c2++){if(sim[move.idx][c2]===null){nc=c2;break;}}for(var c3=nc;c3>0;c3--){sim[move.idx][c3]=sim[move.idx][c3-1];}sim[move.idx][0]=placed;}
    else{var nc2=-1;for(var c4=2;c4>=0;c4--){if(sim[move.idx][c4]===null){nc2=c4;break;}}for(var c5=nc2;c5<2;c5++){sim[move.idx][c5]=sim[move.idx][c5+1];}sim[move.idx][2]=placed;}
  }
  return sim;
}

function gL(tile){return(tile&&tile.faceUp)?LETTER[tile.type][tile.rot]:null;}
function evalSim(sim) {
  var score=0;
  for(var r=0;r<3;r++){var l=[gL(sim[r][0]),gL(sim[r][1]),gL(sim[r][2])];if(l[0]==="O"&&l[1]==="N"&&l[2]==="E")score+=1000;}
  var lines=[[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],[[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],[[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]];
  for(var i=0;i<lines.length;i++){var ls=[gL(sim[lines[i][0][0]][lines[i][0][1]]),gL(sim[lines[i][1][0]][lines[i][1][1]]),gL(sim[lines[i][2][0]][lines[i][2][1]])];if(ls[0]&&ls[0]===ls[1]&&ls[1]===ls[2])score+=50;}
  return score;
}

function showMsg(title,body){
  document.getElementById("msg-title").textContent=title;
  document.getElementById("msg-body").textContent=body;
  document.getElementById("msg-overlay").classList.add("show");
}
function closeMsg(){
  document.getElementById("msg-overlay").classList.remove("show");
  showScreen("home");
  document.getElementById("difficulty-area").style.display="none";
}

// ========== SOUND ==========
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playSound(type) {
  var ctx = getAudioCtx();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  if (type === 'pick') {
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.1);
  } else if (type === 'rotate') {
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.06);
  } else if (type === 'push') {
    osc.frequency.setValueAtTime(330, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } else if (type === 'win') {
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.15);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.30);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.55);
  }
}

showScreen("splash");
setTimeout(function(){
  var seen = false;
  try { seen = localStorage.getItem("theone_seen") === "1"; } catch(e) {}
  if (!seen) {
    try { localStorage.setItem("theone_seen", "1"); } catch(e) {}
    openHowto("home");
  } else {
    showScreen("home");
  }
},2000);
</script>
