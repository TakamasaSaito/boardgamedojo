<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Noto+Sans+JP:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f0f"/>

  <!-- Title: BOARDGAMEDOJO (Orbitron 78px, cyan, center) -->
  <text
    x="600" y="265"
    font-family="Orbitron, sans-serif"
    font-weight="700"
    font-size="78"
    fill="#00bcd4"
    text-anchor="middle"
    dominant-baseline="middle"
  >BOARDGAMEDOJO</text>

  <!-- Subtitle (Noto Sans JP 26px, white, center) -->
  <text
    x="600" y="328"
    font-family="'Noto Sans JP', sans-serif"
    font-weight="700"
    font-size="26"
    fill="#e0e0e0"
    text-anchor="middle"
    dominant-baseline="middle"
  >&#x30D6;&#x30E9;&#x30A6;&#x30B6;&#x3067;&#x904A;&#x3079;&#x308B; 2&#x4EBA;&#x7528;&#x30DC;&#x30FC;&#x30C9;&#x30B2;&#x30FC;&#x30E0;&#x96C6;</text>

  <!-- 13 GAMES chip (cyan bg, dark text, rounded) -->
  <rect x="517" y="375" width="166" height="40" rx="8" fill="#00bcd4"/>
  <text
    x="600" y="395"
    font-family="Orbitron, sans-serif"
    font-weight="700"
    font-size="18"
    fill="#0f0f0f"
    text-anchor="middle"
    dominant-baseline="middle"
  >13 GAMES</text>

  <!-- Bottom separator line -->
  <line x1="60" y1="583" x2="1140" y2="583" stroke="#303030" stroke-width="1"/>

  <!-- Footer URL (right-aligned, dim) -->
  <text
    x="1140" y="598"
    font-family="'Noto Sans JP', sans-serif"
    font-size="11"
    fill="#888888"
    text-anchor="end"
  >takamasasaito.github.io/boardgamedojo</text>
</svg>
