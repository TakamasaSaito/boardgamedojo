<style>
:root {
  --bg:       #0f0f0f;
  --surface:  #1a1a1a;
  --surface2: #222222;
  --accent:   #00bcd4;
  --text:     #e0e0e0;
  --text-dim: #888888;
  --radius:   12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
  background-color: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* ========== グローバルヘッダー ========== */
#app-header {
  position: fixed; top: 0; left: 0; right: 0;
  height: 48px; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: rgba(15,15,15,0.97);
  border-bottom: 1px solid rgba(0,188,212,0.15);
}

.hdr-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

.hdr-btn {
  min-width: 40px; min-height: 40px;
  background: transparent;
  border: 1px solid rgba(0,188,212,0.25);
  border-radius: var(--radius);
  color: var(--text); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
}
.hdr-btn:active { border-color: var(--accent); color: var(--accent); }

/* パンくず */
.breadcrumb { display: flex; align-items: center; flex-shrink: 1; min-width: 0; overflow: hidden; }
.bc-home { display: flex; align-items: center; gap: 4px; text-decoration: none; color: var(--accent); white-space: nowrap; }
.bc-home:hover { opacity: 0.8; }
.bc-arrow { font-size: 14px; }
.bc-site { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.bc-sep { color: #444; font-size: 13px; margin: 0 6px; }
.bc-current { font-size: 14px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
@media (min-width: 769px) { .bc-full { display: inline; } .bc-current { display: inline; } }

/* ========== コンテンツ ========== */
.page-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 20px 64px;
}

.page-logo {
  font-family: 'Orbitron', 'Noto Sans', sans-serif;
  font-size: 11px; font-weight: 700;
  color: var(--accent); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 10px;
}

.page-title {
  font-size: 22px; font-weight: 900;
  color: var(--text); letter-spacing: 0.5px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(0,188,212,0.2);
  margin-bottom: 36px;
}

/* セクション */
.section {
  margin-bottom: 40px;
}

.section-title {
  font-size: 11px; font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px; text-transform: uppercase;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,188,212,0.15);
  margin-bottom: 14px;
}

.section p {
  font-size: 14px;
  color: var(--text);
  line-height: 1.9;
  margin-bottom: 12px;
}

.section p:last-child { margin-bottom: 0; }

.section a {
  color: var(--accent);
  text-decoration: none;
}
.section a:hover { text-decoration: underline; }

/* 箇条書き */
.report-list {
  list-style: none;
  padding: 0;
  margin: 4px 0 12px;
}
.report-list li {
  font-size: 14px;
  color: var(--text);
  line-height: 1.9;
  padding: 2px 0 2px 18px;
  position: relative;
}
.report-list li::before {
  content: '\2013';
  position: absolute;
  left: 0;
  color: var(--accent);
}

/* メモボックス */
.note-box {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid rgba(0,188,212,0.12);
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.85;
  margin-top: 4px;
}

/* フォームリンクボタン */
.form-btn {
  display: inline-block;
  margin: 14px 0 20px;
  padding: 13px 28px;
  background: var(--accent);
  color: #000000;
  font-family: 'Noto Sans JP', 'Noto Sans', sans-serif;
  font-weight: 700;
  font-size: 15px;
  border-radius: var(--radius);
  letter-spacing: 0.5px;
}
a.form-btn, a.form-btn:hover { text-decoration: none; }
a.form-btn:active { opacity: 0.7; }

/* フッター */
footer {
  text-align: center;
  padding: 24px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 11px;
  color: #3a3a3a;
  letter-spacing: 1px;
}

/* ========== PC最適化 ========== */
@media (min-width: 769px) {
  .page-wrap { max-width: 760px; padding: 80px 48px 80px; }
  .page-title { font-size: 28px; }
}
</style>
</head>
<body>

    <span class="bc-sep bc-full"> | </span>

  <div class="hdr-right">
    <button class="hdr-btn" id="lang-btn" onclick="toggleLang()" aria-label="言語切替">&#x1F1EF;&#x1F1F5;</button>

<!-- ===================== コンテンツ ===================== -->
<div class="page-wrap">

  <div class="page-logo">BoardGameDojo</div>

  <!-- 1. はじめに -->
  <section class="section">

</div>

<script>

    sec2Li4:     '発生日時（おおよそで可）',

    sec3Li2:     '端末とブラウザ（例：iPhone 15、Safari 17）',

    sec3Li5:     '発生した事象（どのような問題が起きたか）',
    sec3Note:    '※ GitHubアカウントが必要です。',
    sec4Title:   'プライバシーについて',
    sec4Pre:     '本サイトでのデータ取り扱いについては「',
    sec4Link:    'プライバシーポリシー',

    footerPrivacy:    'プライバシーポリシー',
    footerDisclaimer: '知的財産権',
    langBtn:     '\uD83C\uDDEF\uD83C\uDDF5'
  },
  en: {
    pageTitle:   'Contact',
    bcLabel:     'Contact',
    sec1Title:   'Notice',
    sec1Body:    'BoardGameDojo is a free service developed and operated by an individual. While we cannot guarantee a reply, all feedback is greatly appreciated and considered.',

function applyLang() {

  document.documentElement.lang = lang;
  el = document.getElementById('page-title');      if (el) el.textContent = t.pageTitle;
  el = document.getElementById('bc-label');        if (el) el.textContent = t.bcLabel;
  el = document.getElementById('sec1-title');      if (el) el.textContent = t.sec1Title;
  el = document.getElementById('sec1-body');       if (el) el.textContent = t.sec1Body;
  el = document.getElementById('sec2-title');      if (el) el.textContent = t.sec2Title;
  el = document.getElementById('sec2-body');       if (el) el.textContent = t.sec2Body;
  el = document.getElementById('sec2-btn');        if (el) el.textContent = t.sec2Btn;
  el = document.getElementById('sec2-body2');      if (el) el.textContent = t.sec2Body2;
  el = document.getElementById('sec2-li1');        if (el) el.textContent = t.sec2Li1;
  el = document.getElementById('sec2-li2');        if (el) el.textContent = t.sec2Li2;
  el = document.getElementById('sec2-li3');        if (el) el.textContent = t.sec2Li3;
  el = document.getElementById('sec2-li4');        if (el) el.textContent = t.sec2Li4;

  el = document.getElementById('sec2-li6');        if (el) el.textContent = t.sec2Li6;

  el = document.getElementById('sec3-title');      if (el) el.textContent = t.sec3Title;
  el = document.getElementById('sec3-pre');        if (el) el.textContent = t.sec3Pre;
  el = document.getElementById('sec3-link-text');  if (el) el.textContent = t.sec3Link;
  el = document.getElementById('sec3-post');       if (el) el.textContent = t.sec3Post;
  el = document.getElementById('sec3-body2');      if (el) el.textContent = t.sec3Body2;
  el = document.getElementById('sec3-li1');        if (el) el.textContent = t.sec3Li1;
  el = document.getElementById('sec3-li2');        if (el) el.textContent = t.sec3Li2;
  el = document.getElementById('sec3-li3');        if (el) el.textContent = t.sec3Li3;
  el = document.getElementById('sec3-li4');        if (el) el.textContent = t.sec3Li4;

  el = document.getElementById('sec4-pre');        if (el) el.textContent = t.sec4Pre;
  el = document.getElementById('sec4-link-text');  if (el) el.textContent = t.sec4Link;
  el = document.getElementById('sec4-post');       if (el) el.textContent = t.sec4Post;
  el = document.getElementById('footer-privacy');  if (el) el.textContent = t.footerPrivacy;
  el = document.getElementById('footer-disclaimer'); if (el) el.textContent = t.footerDisclaimer;
  el = document.getElementById('lang-btn');        if (el) el.textContent = t.langBtn;
  el = document.getElementById('lang-btn');        if (el) el.setAttribute('aria-label', lang === 'ja' ? '言語切替' : 'Switch language');
}

function toggleLang() {
  lang = (lang === 'ja') ? 'en' : 'ja';
  applyLang();
}

applyLang();
</script>
